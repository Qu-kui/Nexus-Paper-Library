<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>NPL Connector 设置</title>
  <style>
    body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; max-width: 520px; margin: 40px auto; color: #0f2537; }
    h1 { font-size: 20px; }
    label { display: block; font-size: 13px; color: #6b7c8f; margin-top: 18px; }
    input { width: 160px; padding: 7px 9px; border: 1px solid #e2e9f1; border-radius: 7px; font-size: 13px; }
    button { margin-top: 16px; padding: 8px 14px; border: none; border-radius: 8px; background: #14a3a3; color: #fff; font-size: 13px; cursor: pointer; }
    button.ghost { background: #eef2f7; color: #0f2537; }
    #status { margin-top: 14px; font-size: 13px; color: #6b7c8f; }
    .tip { font-size: 12px; color: #6b7c8f; line-height: 1.6; margin-top: 22px; }
  </style>
</head>
<body>
  <h1>NPL Connector</h1>
  <p>连接到本机运行的 NPL 桌面程序。</p>
  <label>NPL 端口
    <input id="port" type="number" min="1" max="65535" placeholder="8765" />
  </label>
  <div>
    <button id="save">保存</button>
    <button id="test" class="ghost">测试连接</button>
  </div>
  <div id="status"></div>
  <p class="tip">
    默认端口是 8765；如果 NPL 启动时 8765 被占用，会自动用 8766~8794，插件会自动探测这段端口。
    只有同时开多个 NPL 时，才需要在这里手动指定。
  </p>
  <script src="options.js"></script>
</body>
</html>
